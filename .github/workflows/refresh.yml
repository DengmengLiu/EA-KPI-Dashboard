name: Auto Refresh KPI Dashboard

on:
  push:
    paths:
      - 'data/latest.xlsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Convert Excel to JSON
        run: python scripts/excel_to_json.py

      - name: Inject data into index.html
        run: python scripts/inject_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/data.json
          git diff --staged --quiet || (git commit -m "Auto-refresh KPI dashboard data [skip ci]" && git push)
